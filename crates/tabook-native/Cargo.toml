[package]
name = "tabook-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2", features = ["async"] }
napi-derive = "2"
quick-xml = "0.36"
encoding_rs = "0.8"
zip = "2"
unicode-normalization = "0.1"
aho-corasick = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2"
rayon = "1"
dirs = "5"
once_cell = "1"
parking_lot = "0.12"
regex = "1"

[features]
default = ["napi-runtime"]
napi-runtime = []

[build-dependencies]
napi-build = "2"