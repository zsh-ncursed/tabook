name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Cover the whole supported range: the minimum version from
    # package.json's engines field (better-sqlite3's prebuilds need
    # Node-API 10, which landed in 22.14.0), the current Active LTS
    # line, and whatever Node considers 'latest' at run time. Node 20
    # is EOL (April 2026) and its CI job failed with 'Worker exited
    # unexpectedly', so it is intentionally not in this matrix.
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.14.0', '24', 'latest']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test & coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
