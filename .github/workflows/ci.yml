name: CI

on:
  push:
    branches: [main, feat/rust-native]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        run: cargo test --no-default-features --manifest-path crates/tabook-native/Cargo.toml

      - name: Cargo clippy
        run: cargo clippy --no-default-features --manifest-path crates/tabook-native/Cargo.toml -- -D warnings
        continue-on-error: true

      # Compile the napi layer (default features) without needing npm/
      # @napi-rs/cli — cargo test/clippy use --no-default-features to stay
      # linkable without the napi runtime, so this is the only place the
      # #[cfg(feature = "napi-runtime")] code gets compile-checked here.
      - name: Build napi layer
        run: cargo build --manifest-path crates/tabook-native/Cargo.toml

  ts-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build native
        run: npm run build:native

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The npm package must be self-contained: `npm pack` vendors the Rust
      # binding into dist/node_modules/@tabook/native (scripts/prepare-npm.mjs)
      # and this installs the packed tarball like a user would, proving the CLI
      # boots on the native module and the DB layer (rusqlite) works. Guards the
      # 0.5.x regression where the packed package had no binding at all and
      # `tabook` died on startup with "better-sqlite3 is not installed".
      - name: Verify the npm package
        run: npm run verify:npm
