name: CI

on:
  push:
    branches: [main, feat/rust-native]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        run: cargo test --no-default-features --manifest-path crates/tabook-native/Cargo.toml

      - name: Cargo clippy
        run: cargo clippy --no-default-features --manifest-path crates/tabook-native/Cargo.toml -- -D warnings
        continue-on-error: true

      # Compile the napi layer (default features) without needing npm/
      # @napi-rs/cli — cargo test/clippy use --no-default-features to stay
      # linkable without the napi runtime, so this is the only place the
      # #[cfg(feature = "napi-runtime")] code gets compile-checked here.
      - name: Build napi layer
        run: cargo build --manifest-path crates/tabook-native/Cargo.toml

  ts-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build native
        run: npm run build:native

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
