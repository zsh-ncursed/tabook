name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Node 22 (LTS) ships npm 10, matching the npm@10-generated
    # lockfile. Node 20 is EOL (April 2026) and its CI job failed
    # with 'Worker exited unexpectedly'. 'latest' (npm 11/12)
    # computes a different ideal tree for the vite esbuild override
    # and breaks npm ci with EUSAGE — so pin a single LTS version.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
