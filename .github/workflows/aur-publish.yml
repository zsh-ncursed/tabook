name: Publish to AUR

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test & coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  publish:
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git openssh namcap

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing version $TAG to AUR"

      - name: Generate .SRCINFO
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.version }}/" PKGBUILD
          makepkg --printsrcinfo > .SRCINFO
          echo "=== .SRCINFO ==="
          cat .SRCINFO

      - name: Validate PKGBUILD
        run: namcap PKGBUILD || true

      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_key
            User ${{ secrets.AUR_USERNAME }}
EOF

      - name: Clone AUR repository
        run: |
          git clone ssh://aur.archlinux.org/tabook.git aur-repo
          cd aur-repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Update AUR files
        run: |
          cp PKGBUILD aur-repo/
          cp .SRCINFO aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${{ steps.version.outputs.version }}" || echo "No changes to commit"

      - name: Push to AUR
        run: |
          cd aur-repo
          git push origin master