name: Publish to AUR

# Runs after the Release workflow (which builds the per-arch tarballs and
# attaches them to the GitHub Release). We must wait for those assets: their
# sha256 hashes are baked into the PKGBUILD that gets pushed to AUR.
on:
  workflow_run:
    workflows: ['Release']
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    # AUR's SSH server answers every package under the AUR account username.
    # Point ssh at the deploy key and let the first connection accept and
    # record the host key (ssh-keyscan inside the container proved unreliable).
    env:
      GIT_SSH_COMMAND: ssh -i ~/.ssh/aur_key -l ${{ secrets.AUR_USERNAME }} -o StrictHostKeyChecking=accept-new

    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git openssh namcap github-cli

      - name: Checkout the tagged commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Extract version from tag
        id: version
        run: |
          # The archlinux container checks out as a different uid than the
          # runner's, so git refuses to operate on the repo until it is marked
          # safe. The later AUR clone/commit steps need it too.
          git config --global --add safe.directory "$PWD"
          git fetch --tags --force
          TAG="$(git describe --tags --abbrev=0 HEAD)"
          TAG="${TAG#v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing version $TAG to AUR"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          mkdir -p /tmp/assets
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'tabook-*.tar.zst' \
            --dir /tmp/assets
          ls -lh /tmp/assets

      - name: Fill in sha256 hashes
        run: |
          SHA_X64="$(sha256sum /tmp/assets/tabook-*-linux-x64.tar.zst | cut -d' ' -f1)"
          SHA_ARM64="$(sha256sum /tmp/assets/tabook-*-linux-arm64.tar.zst | cut -d' ' -f1)"
          sed -i "s/__SHA256_X64__/${SHA_X64}/; s/__SHA256_ARM64__/${SHA_ARM64}/" PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.version }}/" PKGBUILD
          grep -E 'pkgver|sha256sums' PKGBUILD

      - name: Generate .SRCINFO
        run: |
          # makepkg refuses to run as root, but the container's default user is
          # root (needed earlier for pacman). Create a builder user, hand it the
          # checkout, and generate .SRCINFO as that user.
          useradd -m builder
          chown -R builder:builder .
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO
          echo "=== .SRCINFO ==="
          cat .SRCINFO

      - name: Validate PKGBUILD
        run: namcap PKGBUILD || true

      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          # Pre-populate known_hosts so the clone step doesn't fail on
          # StrictHostKeyChecking. accept-new proved unreliable inside the
          # archlinux container, so trust the key explicitly.
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Clone AUR repository
        run: |
          git clone ssh://aur.archlinux.org/tabook.git aur-repo
          cd aur-repo
          # Same uid mismatch as the main checkout — mark the clone safe too.
          git config --global --add safe.directory "$PWD"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Update AUR files
        run: |
          cp PKGBUILD aur-repo/
          cp .SRCINFO aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${{ steps.version.outputs.version }}" || echo "No changes to commit"

      - name: Push to AUR
        run: |
          cd aur-repo
          git push origin master
