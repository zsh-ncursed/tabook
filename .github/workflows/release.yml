name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Build the self-contained release tarball for both supported
  # architectures. Each artifact contains the esbuild bundle, the Rust native
  # module and the better-sqlite3 prebuild — nothing is compiled at install
  # time, so the AUR package stays small and installs instantly.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build native
        run: npm run build:native

      - name: Rust core tests
        run: npm run test:native

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify version matches the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "tag v$TAG does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

  build-assets:
    needs: test
    strategy:
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build release tarball
        run: TARGET_ARCH=${{ matrix.arch }} node scripts/package-release.mjs

      - name: Smoke test
        run: |
          DIR=$(ls -d build/tabook-*-linux-${{ matrix.arch }})
          cd "$DIR"
          # The launcher lives inside the PKGBUILD; here run the bundle directly.
          node tabook.bundle.mjs --version
          # The packaged @tabook/native must expose the full API through the
          # bundle's resolution path (createRequire → index.cjs). A regression
          # here (e.g. resolving index.js's ESM { default } wrapper instead)
          # silently disables every native feature — check the key exports and
          # exercise one real call. Ran from inside the tarball layout so the
          # require resolves to the packaged node_modules, not the repo's.
          node --input-type=module -e "
            import { createRequire } from 'node:module';
            import { rmSync } from 'node:fs';
            const require = createRequire(import.meta.url);
            const n = require('@tabook/native');
            for (const fn of ['parseOpdsAtom', 'BookLayout', 'parseBookFile', 'imageToPng']) {
              if (typeof n[fn] !== 'function') throw new Error('missing native export: ' + fn);
            }
            const feed = n.parseOpdsAtom('<?xml version=\"1.0\"?><feed xmlns=\"http://www.w3.org/2005/Atom\"><title>T</title></feed>');
            if (!feed || feed.title !== 'T') throw new Error('parseOpdsAtom broken');
            // The DB layer is native (rusqlite) in the package — no
            // better-sqlite3 ships. Verify a real open/add/get cycle works
            // without it (regression guard for the 0.3.x native-loader bugs).
            const dbPath = '/tmp/tabook-smoke-' + process.pid + '.sqlite';
            const db = n.openLibraryDb(dbPath);
            // napi-rs object fields reject explicit null for optional structs
            // (Option<T> fields accept undefined/omitted only) — send a minimal
            // metadata object the way the app's parsers do.
            const id = db.addBook('/tmp/smoke.fb2', 'smoke.fb2', 'fb2', 10, {
              title: 'Smoke', authors: [], genres: [], annotation: '',
            }, null);
            if (!(id > 0)) throw new Error('LibraryDb.addBook broken');
            const got = db.getBook(id);
            if (!got || got.title !== 'Smoke') throw new Error('LibraryDb.getBook broken');
            db.close();
            rmSync(dbPath, { force: true });
            console.log('native exports + OPDS parse + DB cycle OK');
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabook-${{ matrix.arch }}
          path: build/tabook-*-linux-${{ matrix.arch }}.tar.zst
          if-no-files-found: error

  publish-release:
    needs: build-assets
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            assets/*.tar.zst \
            --title "tabook $TAG" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"
