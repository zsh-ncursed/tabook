name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Build the self-contained release tarball for both supported
  # architectures. Each artifact contains the esbuild bundle, the Rust native
  # module and the better-sqlite3 prebuild — nothing is compiled at install
  # time, so the AUR package stays small and installs instantly.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build native
        run: npm run build:native

      - name: Rust core tests
        run: npm run test:native

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify version matches the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "tag v$TAG does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

  build-assets:
    needs: test
    strategy:
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build release tarball
        run: TARGET_ARCH=${{ matrix.arch }} node scripts/package-release.mjs

      - name: Smoke test
        run: |
          DIR=$(ls -d build/tabook-*-linux-${{ matrix.arch }})
          # The launcher lives inside the PKGBUILD; here run the bundle directly.
          node "$DIR/tabook.bundle.mjs" --version
          # The bundled native module must actually load (not silently fall
          # back to the pure-TS implementations).
          node -e "
            const n = require('./crates/tabook-native/index.cjs');
            if (typeof n.BookLayout !== 'function') throw new Error('native module broken');
            console.log('native OK');
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabook-${{ matrix.arch }}
          path: build/tabook-*-linux-${{ matrix.arch }}.tar.zst
          if-no-files-found: error

  publish-release:
    needs: build-assets
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            assets/*.tar.zst \
            --title "tabook $TAG" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"
